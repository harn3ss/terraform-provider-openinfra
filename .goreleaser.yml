# GoReleaser config for a Terraform Registry provider.
#
# The Registry requires: one binary per OS/arch named
# terraform-provider-{NAME}_v{VERSION}, a _SHA256SUMS file, and a GPG signature
# of that checksum file. It also requires the repository to be PUBLIC.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: ["386", amd64, arm, arm64]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  # The Registry refuses a release in which any published asset is missing from the
  # checksum file ("missing SHA256 checksum for ..._manifest.json"). Listing the
  # manifest under `release.extra_files` alone is NOT enough — that only uploads it.
  # It has to be hashed here as well, and under the SAME name it is uploaded with,
  # or the checksum entry won't match the asset.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      # GPG_FINGERPRINT must match the key uploaded to the Terraform Registry.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # The Registry ingests the tag; drafts are not visible to it.
  draft: false
  # The Registry reads terraform-registry-manifest.json to learn which plugin
  # protocol this provider speaks. WITHOUT it the Registry assumes protocol 5.0 —
  # and terraform-plugin-framework serves 6.0, so every `terraform init` would fail
  # with a protocol mismatch. It must be published alongside the archives under
  # this exact name.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
