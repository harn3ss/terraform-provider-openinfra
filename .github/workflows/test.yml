name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # The docs/ tree is generated from the provider schema. If it is regenerated
      # here and differs, someone changed a schema without running `go generate` —
      # and the Terraform Registry serves docs/ verbatim, so stale docs are shipped
      # docs. Failing here is the only place this gets caught.
      - name: docs are up to date
        run: |
          go generate ./...
          if ! git diff --quiet -- docs/; then
            echo "docs/ is stale — run 'go generate ./...' and commit the result:"
            git --no-pager diff --stat -- docs/
            exit 1
          fi
