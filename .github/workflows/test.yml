name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Source of truth for the kinds.go <-> XRD drift guard (TestKindsMatchXRDs). open-infra
      # is public, so no token is needed. Without this the guard would FAIL under CI (it refuses
      # to silently skip when CI=true) — checking it out here is what lets the guard actually run.
      - name: Check out open-infra (XRD source of truth)
        uses: actions/checkout@v4
        with:
          repository: harn3ss/open-infra
          path: _openinfra

      - name: go vet
        run: go vet ./...

      # Scope gofmt to THIS repo's tracked Go files. `gofmt -l .` also sweeps the
      # _openinfra/ checkout above (a foreign repo on its own gofmt cadence) and would
      # fail on drift that isn't ours to fix.
      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: test
        env:
          # Point the drift guard at the sibling open-infra checkout so it RUNS here rather than
          # skips. The env var takes precedence over the local-sibling fallback used in dev.
          OPENINFRA_XRD_DIR: ${{ github.workspace }}/_openinfra/platform/abstraction
        run: go test ./...

      # The docs/ tree is generated from the provider schema. If it is regenerated
      # here and differs, someone changed a schema without running `go generate` —
      # and the Terraform Registry serves docs/ verbatim, so stale docs are shipped
      # docs. Failing here is the only place this gets caught.
      - name: docs are up to date
        run: |
          go generate ./...
          if ! git diff --quiet -- docs/; then
            echo "docs/ is stale — run 'go generate ./...' and commit the result:"
            git --no-pager diff --stat -- docs/
            exit 1
          fi
